<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}RealDeal{% endblock %} - SoftRIP Job Sender</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark border-bottom border-secondary">
  <div class="container-fluid px-3">
    <a class="navbar-brand fw-semibold" href="{{ url_for('main.index') }}"><i class="bi bi-printer me-2"></i>RealDeal</a>
    <div>
      <a class="btn btn-primary btn-sm" href="{{ url_for('main.new_job') }}"><i class="bi bi-plus-lg me-1"></i>New Job</a>
      <a class="btn btn-outline-secondary btn-sm" href="{{ url_for('main.rip_status_page') }}"><i class="bi bi-activity me-1"></i>Status</a>
      <a class="btn btn-outline-secondary btn-sm" href="{{ url_for('main.settings') }}"><i class="bi bi-gear me-1"></i>Settings</a>
    </div>
  </div>
</nav>
<main class="container py-4">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert alert-{{ 'danger' if category == 'danger' else 'warning' if category == 'warning' else 'success' }} alert-dismissible">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
