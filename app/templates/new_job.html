{% extends "base.html" %}
{% block title %}New Job{% endblock %}
{% block content %}
<style>
  input[type="file"].form-control::file-selector-button {
    background-color: #cfe2ff;
    color: #111;
  }
  .new-job-form { font-size: .90em; padding: 1rem 1.25rem; }
  .new-job-form .form-control, .new-job-form .form-select, .new-job-form .form-label {
    font-size: inherit;
  }
  .new-job-form > .mb-3:not(:has(.annot)) .form-control,
  .new-job-form > .mb-3:not(:has(.annot)) .form-select {
    padding: .25rem .5rem;
  }
  .annot .annot-input .input-group-text,
  .annot .annot-input .form-control {
    font-size: .85em !important;
  }
</style>
<h1 class="h3 mb-3">New Print Job</h1>
<form method="post" enctype="multipart/form-data" class="card new-job-form" style="max-width: 720px">
  <div class="mb-3">
    <label class="form-label">Artwork file</label>
    <input type="file" class="form-control" name="artwork" required>
    <div class="form-text">Accepted: PDF, PS, EPS, TIFF, JPG, PNG, BMP, GIF, PSD</div>
  </div>
  <div class="mb-3">
    <label class="form-label">Job Name</label>
    <input type="text" class="form-control" name="name" placeholder="e.g. Banner for Acme" required>
  </div>
  <div class="row g-3 mb-3">
    <div class="col-6 col-md-3">
      <label class="form-label">Print Unit</label>
      <select class="form-select" name="unit">
        {% for u in units %}<option value="{{ u }}" {{ 'selected' if u == '1' }}>{{ u }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-6 col-md-3">
      <label class="form-label">Copies</label>
      <input type="number" class="form-control" name="copies" value="1" min="0" max="9999">
    </div>
    <div class="col-6 col-md-3">
      <label class="form-label">Rotate</label>
      <select class="form-select" name="rotate">
        <option value="0">None</option><option value="90">90&deg;</option>
        <option value="180">180&deg;</option><option value="270">270&deg;</option>
      </select>
    </div>
    <div class="col-6 col-md-3">
      <label class="form-label">Mirror</label>
      <div class="form-check mt-2"><input class="form-check-input" type="checkbox" name="mirror"><label class="form-check-label">On</label></div>
    </div>
  </div>
  <div class="row g-3 mb-3">
    <div class="col-6 col-md-3">
      <label class="form-label">Scale %</label>
      <input type="number" class="form-control" name="scale" value="100" min="1" max="1000">
    </div>
    <div class="col-6 col-md-3">
      <label class="form-label">PDF page</label>
      <input type="number" class="form-control" name="pageno" value="" min="1" placeholder="(all/1)">
    </div>
    <div class="col-md-6">
      <label class="form-label">Imaging Config</label>
      <input type="text" class="form-control" name="imgconf" id="imgconf" list="imgconf_list" placeholder="leave blank for unit default">
      <datalist id="imgconf_list"></datalist>
      <div class="form-text" id="imgconf_hint">select a print unit to load configs from SoftRIP</div>
    </div>
  </div>
  <div class="mb-3">
    <label class="form-label">Annotations</label>
    <div class="annot small" style="font-size:.85em">
      <div class="d-flex flex-wrap gap-3">
        <div class="form-check"><input class="form-check-input" type="checkbox" name="ann_job_name"><label class="form-check-label">Job Name</label></div>
        <div class="form-check"><input class="form-check-input" type="checkbox" name="ann_file_name"><label class="form-check-label">File Name</label></div>
        <div class="form-check"><input class="form-check-input" type="checkbox" name="ann_printer"><label class="form-check-label">Printer</label></div>
        <div class="form-check"><input class="form-check-input" type="checkbox" name="ann_imgconf"><label class="form-check-label">Imaging Configuration</label></div>
        <div class="form-check"><input class="form-check-input" type="checkbox" name="ann_date"><label class="form-check-label">Date</label></div>
        <div class="form-check"><input class="form-check-input" type="checkbox" name="ann_barcode"><label class="form-check-label">Barcode</label></div>
      </div>
      <div class="d-flex flex-wrap gap-3 align-items-center">
        <div class="form-check"><input class="form-check-input" type="checkbox" name="ann_comment_on" id="ann_comment_on"><label class="form-check-label" for="ann_comment_on">Comment</label></div>
        <input type="text" class="form-control form-control-sm" name="ann_comment" style="width:280px" placeholder="comment text to print below the job">
        <div class="form-check"><input class="form-check-input" type="checkbox" name="ann_qrcode" id="ann_qrcode"><label class="form-check-label" for="ann_qrcode">QR Code</label></div>
        <div class="input-group annot-input" style="width:150px">
          <span class="input-group-text">Height (in)</span>
          <input type="number" step="0.05" min="0" class="form-control" name="ann_qrcode_height" value="0.75">
        </div>
      </div>
    </div>
  </div>
  <div class="mb-3">
    <label class="form-label">Notes</label>
    <input type="text" class="form-control" name="notes" placeholder="internal notes, not sent to SoftRIP">
  </div>
  <div class="row g-3 mb-3">
    <div class="col-6 col-md-3">
      <label class="form-label">Cut Outline</label>
      <select class="form-select" name="cut_enabled" id="cut_enabled">
        <option value="">None</option><option value="1">Generate</option>
      </select>
    </div>
    <div class="col-6 col-md-3">
      <label class="form-label">Bleed (in)</label>
      <input type="number" step="0.25" class="form-control" name="cut_bleed" value="0.25" id="cut_bleed" disabled>
    </div>
    <div class="col-6 col-md-3">
      <label class="form-label">Corner Radius (in)</label>
      <input type="number" step="0.25" class="form-control" name="cut_radius" value="0" min="0" step="0.25" id="cut_radius" disabled>
    </div>
  </div>
  <div class="form-check form-check-inline mb-3">
    <input class="form-check-input" type="checkbox" name="delete_after_rip">
    <label class="form-check-label">Delete source file after ripping</label>
  </div>
  <div class="form-check form-check-inline mb-3">
    <input class="form-check-input" type="checkbox" name="delete_after_print">
    <label class="form-check-label">Delete the print queue item after printing</label>
  </div>
  <div>
    <button class="btn btn-primary" type="submit"><i class="bi bi-send me-1"></i>Submit to hot folder</button>
  </div>
</form>
{% endblock %}
{% block scripts %}
<script>
const cutSel = document.getElementById('cut_enabled');
const cutBleed = document.getElementById('cut_bleed');
const cutRadius = document.getElementById('cut_radius');
function cutToggle() {
  const on = cutSel.value === '1';
  cutBleed.disabled = !on;
  cutRadius.disabled = !on;
}
cutSel.addEventListener('change', cutToggle);

const qrBox = document.getElementById('ann_qrcode');
const dateBox = document.querySelector('input[name="ann_date"]');
qrBox.addEventListener('change', () => {
  if (qrBox.checked) dateBox.checked = true;
});

const unitSelect = document.querySelector('select[name="unit"]');
const imgconfInput = document.getElementById('imgconf');
const imgconfList = document.getElementById('imgconf_list');
const imgconfHint = document.getElementById('imgconf_hint');

async function loadImgconfs() {
  imgconfList.innerHTML = '';
  imgconfHint.textContent = 'loading configs from SoftRIP…';
  try {
    const r = await fetch(`/api/imgconfs/${unitSelect.value}`);
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    (data.imgconfs || []).forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      imgconfList.appendChild(opt);
    });
    imgconfHint.textContent = data.imgconfs.length
      ? `${data.imgconfs.length} config(s) from SoftRIP — start typing to filter`
      : 'could not load configs — enter an IMGCONF name manually';
  } catch {
    imgconfHint.textContent = 'could not load configs — enter an IMGCONF name manually';
  }
}
unitSelect.addEventListener('change', loadImgconfs);
loadImgconfs();
</script>
{% endblock %}
